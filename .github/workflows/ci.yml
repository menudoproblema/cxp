name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        msgspec-policy: ["minimum", "latest"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ "${{ matrix.msgspec-policy }}" = "minimum" ]; then
            pip install 'msgspec==0.20.0'
          else
            pip install --upgrade 'msgspec>=0.20.0,<1'
          fi

      - name: Standalone source gates
        run: python scripts/check.py

      - name: Build and inspect candidate
        run: python scripts/build_candidate.py

      - name: Verify installed wheel and sdist
        run: >-
          python scripts/verify_artifacts.py
          --dist dist/4.0.0
          --msgspec ${{ matrix.msgspec-policy }}
          --report dist/4.0.0/reports/${{ matrix.python-version }}-${{ matrix.msgspec-policy }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: cxp-${{ matrix.python-version }}-${{ matrix.msgspec-policy }}
          path: |
            dist/4.0.0/**
