name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: >-
          python -m pip install --upgrade pip &&
          pip install -c requirements/release.txt -e ".[dev]"
      - name: Standalone source gates
        run: python scripts/check.py
      - id: version
        name: Read project version
        run: echo "value=$(python -c 'from cxp import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"
      - name: Build reproducible candidate
        run: python scripts/build_candidate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-${{ steps.version.outputs.value }}
          path: dist/${{ steps.version.outputs.value }}
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        dependency-policy: [minimum, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-${{ needs.build.outputs.version }}
          path: dist/${{ needs.build.outputs.version }}
      - name: Verify installed wheel and sdist
        run: >-
          python scripts/verify_artifacts.py
          --dist dist/${{ needs.build.outputs.version }}
          --dependencies ${{ matrix.dependency-policy }}
          --report dist/${{ needs.build.outputs.version }}/reports/${{ matrix.python-version }}-${{ matrix.dependency-policy }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: report-${{ matrix.python-version }}-${{ matrix.dependency-policy }}
          path: dist/${{ needs.build.outputs.version }}/reports/*.json
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-${{ needs.build.outputs.version }}
          path: dist/${{ needs.build.outputs.version }}
      - name: Smoke installed wheel, CLI and Unicode paths
        run: python scripts/smoke_artifact.py --dist dist/${{ needs.build.outputs.version }}

  evidence:
    needs: [build, verify, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-${{ needs.build.outputs.version }}
          path: dist/${{ needs.build.outputs.version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: report-*
          path: dist/${{ needs.build.outputs.version }}/reports
          merge-multiple: true
      - name: Close exact release evidence
        run: python scripts/release_evidence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-candidate-${{ needs.build.outputs.version }}
          path: dist/${{ needs.build.outputs.version }}
          if-no-files-found: error
