name: Publish verified candidate

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: CI run containing the verified candidate
        required: true
        type: string
      version:
        description: Exact version to publish, without v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cxp
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/v${{ inputs.version }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-candidate-${{ inputs.version }}
          path: dist/${{ inputs.version }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Select the exact accredited distributions
        env:
          CXP_RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          python scripts/prepare_publication.py
          --dist "dist/$CXP_RELEASE_VERSION"
          --output upload
      - name: Publish with PyPI Trusted Publishing and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: upload
          print-hash: true

  verify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/v${{ inputs.version }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-candidate-${{ inputs.version }}
          path: dist/${{ inputs.version }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify hashes and install from PyPI
        env:
          CXP_RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          python scripts/verify_publication.py
          --dist "dist/$CXP_RELEASE_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-evidence-${{ inputs.version }}
          path: dist/${{ inputs.version }}/publication-evidence.json
          if-no-files-found: error
